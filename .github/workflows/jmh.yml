name: JMH Benchmarks

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run JMH Benchmarks
        run: mvn test-compile exec:java -Dexec.mainClass=io.audit.core.AuditLoggerBenchmark -B

      - name: Upload JMH Results
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results
          path: |
            jmh-result.json
            jmh-result.csv
