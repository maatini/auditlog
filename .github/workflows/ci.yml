name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Unit Tests
        run: mvn clean test -Djacoco.skip=true -B

      - name: Integration Tests
        run: mvn test -Pintegration -Djacoco.skip=true -B
        env:
          AUDITLOG_JDBC_URL: jdbc:postgresql://localhost:5432/audit_test
          AUDITLOG_JDBC_USER: test
          AUDITLOG_JDBC_PASS: test

  coverage:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test with JaCoCo
        run: mvn test jacoco:report -B

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: PIT Mutation Testing
        run: mvn pitest:mutationCoverage -B

      - name: Upload PIT report
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports/

  security-scan:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Restore OWASP Dependency-Check data
        uses: actions/cache/restore@v6
        with:
          path: ~/.owasp-nvd
          key: owasp-nvd-feed-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-nvd-feed-${{ runner.os }}-

      - name: OWASP Dependency Check
        run: mvn dependency-check:check -B -DdataDirectory=${HOME}/.owasp-nvd

      - name: Upload OWASP Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check-report.html

      - name: Save OWASP Dependency-Check data
        if: success()
        uses: actions/cache/save@v6
        with:
          path: ~/.owasp-nvd
          key: owasp-nvd-feed-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
