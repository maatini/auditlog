<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)" />

  <!-- Grid pattern -->
  <g opacity="0.03" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" />
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
  </g>

  <!-- Decorative circles -->
  <circle cx="120" cy="520" r="180" fill="#38bdf8" opacity="0.04" />
  <circle cx="1160" cy="120" r="200" fill="#a78bfa" opacity="0.04" />
  <circle cx="640" cy="320" r="300" fill="#818cf8" opacity="0.02" />

  <!-- Database icon (stylized) -->
  <g transform="translate(80, 140)" filter="url(#shadow)">
    <ellipse cx="60" cy="30" rx="60" ry="20" fill="none" stroke="url(#accent)" stroke-width="2.5" />
    <path d="M0 30 L0 140" fill="none" stroke="url(#accent)" stroke-width="2.5" />
    <path d="M120 30 L120 140" fill="none" stroke="url(#accent)" stroke-width="2.5" />
    <ellipse cx="60" cy="140" rx="60" ry="20" fill="none" stroke="url(#accent)" stroke-width="2.5" />
    <path d="M0 60 Q60 40 120 60" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5" />
    <path d="M0 90 Q60 70 120 90" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5" />
    <path d="M0 120 Q60 100 120 120" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5" />
  </g>

  <!-- Right-side decorative JSON block -->
  <g transform="translate(1020, 140)" opacity="0.15" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="200" rx="8" fill="none" stroke="#38bdf8" stroke-width="1" />
    <text x="16" y="30" font-family="monospace" font-size="11" fill="#38bdf8">
      <tspan x="16" y="30">{</tspan>
      <tspan x="26" y="46">"actor_id":</tspan>
      <tspan x="26" y="60">"action":</tspan>
      <tspan x="26" y="74">"entity":</tspan>
      <tspan x="36" y="88">"type":</tspan>
      <tspan x="36" y="102">"id":</tspan>
      <tspan x="26" y="116">"changes":</tspan>
      <tspan x="36" y="130">"status":</tspan>
      <tspan x="36" y="144">"old":"PENDING",</tspan>
      <tspan x="36" y="158">"new":"SHIPPED"</tspan>
      <tspan x="26" y="172">},</tspan>
      <tspan x="26" y="186">"metadata":{}</tspan>
      <tspan x="16" y="200">}</tspan>
    </text>
  </g>

  <!-- Main title -->
  <g filter="url(#shadow)">
    <text x="180" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#94a3b8" letter-spacing="2">AUDIT LOG CORE</text>
    <text x="180" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#64748b" letter-spacing="1">LIGHTWEIGHT POSTGRESQL-BACKED</text>
    <text x="180" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#64748b" letter-spacing="1">AUDIT TRAIL LIBRARY</text>
  </g>

  <!-- Bottom tagline -->
  <g filter="url(#shadow)">
    <text x="180" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#475569" letter-spacing="1">
      Java 21 · PostgreSQL · JSONB · Virtual Threads · Async
    </text>
  </g>

  <!-- Accent line -->
  <rect x="180" y="440" width="80" height="3" rx="1.5" fill="url(#accent)" />

  <!-- Bottom-left info -->
  <g transform="translate(80, 520)" opacity="0.6">
    <rect x="0" y="0" width="120" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="12" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#38bdf8">v1.0.0</text>
  </g>

  <!-- Log stream animation effect -->
  <g opacity="0.07">
    <rect x="180" y="500" width="200" height="2" rx="1" fill="#38bdf8" />
    <rect x="390" y="520" width="150" height="2" rx="1" fill="#818cf8" />
    <rect x="180" y="540" width="300" height="2" rx="1" fill="#38bdf8" />
    <rect x="490" y="560" width="100" height="2" rx="1" fill="#818cf8" />
  </g>
</svg>
