<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <linearGradient id="pgBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#336791" />
      <stop offset="100%" stop-color="#2196F3" />
    </linearGradient>
    <linearGradient id="javaOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ED8B00" />
      <stop offset="100%" stop-color="#FFB74D" />
    </linearGradient>
    <linearGradient id="threadGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)" />
  <rect width="1280" height="640" fill="url(#grid)" />

  <circle cx="1050" cy="250" r="250" fill="#336791" opacity="0.15" filter="url(#glow)" />
  <circle cx="200" cy="500" r="300" fill="#4F46E5" opacity="0.12" filter="url(#glow)" />

  <g transform="translate(840, 150)">
    <path d="M 60 260 C 60 290, 260 290, 260 260 L 260 120 C 260 150, 60 150, 60 120 Z" fill="#0F172A" stroke="url(#pgBlue)" stroke-width="3" />
    <ellipse cx="160" cy="120" rx="100" ry="32" fill="#1E293B" stroke="url(#pgBlue)" stroke-width="3" />
    
    <ellipse cx="160" cy="180" rx="80" ry="25" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />
    <text x="160" y="185" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">JSONB</text>

    <path d="M -180 20 C -60 20, 20 100, 120 110" fill="none" stroke="url(#threadGreen)" stroke-width="4" filter="url(#glow)" stroke-linecap="round" />
    <circle cx="-180" cy="20" r="6" fill="#10B981" />
    <circle cx="120" cy="110" r="5" fill="#10B981" />

    <path d="M -140 -30 C -40 -30, 40 80, 140 95" fill="none" stroke="url(#javaOrange)" stroke-width="3" opacity="0.8" stroke-linecap="round" />
    <circle cx="-140" cy="-30" r="5" fill="#ED8B00" />
    
    <path d="M -200 90 C -100 90, 0 125, 100 125" fill="none" stroke="#3B82F6" stroke-width="2.5" opacity="0.5" stroke-linecap="round" />
    <circle cx="-200" cy="90" r="4" fill="#3B82F6" />

    <rect x="-80" y="25" width="14" height="14" rx="4" fill="#10B981" transform="rotate(12)" />
    <rect x="-10" y="60" width="10" height="10" rx="2" fill="#ED8B00" />
  </g>

  <g transform="translate(100, 160)">
    <rect x="0" y="0" width="165" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <circle cx="18" cy="17" r="5" fill="#ED8B00" />
    <text x="34" y="22" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5">JAVA 21 LIBRARY</text>

    <text x="0" y="105" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
      Audit Log <tspan fill="url(#pgBlue)">Core</tspan>
    </text>

    <text x="0" y="155" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
      Lightweight PostgreSQL-backed audit logging
    </text>
    <text x="0" y="185" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400">
      powered by <tspan fill="#10B981" font-weight="600">Virtual Threads</tspan> &amp; <tspan fill="#38BDF8" font-weight="600">JSONB</tspan>.
    </text>

    <g transform="translate(0, 245)">
      <g transform="translate(0, 0)">
        <rect width="220" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
        <path d="M 16 21 L 22 27 L 34 15" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="46" y="26" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Async &amp; Non-Blocking</text>
      </g>

      <g transform="translate(235, 0)">
        <rect width="190" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
        <path d="M 16 21 L 22 27 L 34 15" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="46" y="26" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Backpressure Safe</text>
      </g>

      <g transform="translate(0, 55)">
        <rect width="220" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
        <path d="M 16 21 L 22 27 L 34 15" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="46" y="26" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Bring Your Own Pool</text>
      </g>
      
      <g transform="translate(235, 55)">
        <rect width="190" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
        <path d="M 16 21 L 22 27 L 34 15" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="46" y="26" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Minimal Dependencies</text>
      </g>
    </g>
  </g>

  <g transform="translate(100, 570)">
    <text x="0" y="0" fill="#475569" font-family="monospace" font-size="14">
      logger.log(AuditEntry.builder().actorId("user").action("UPDATE").build());
    </text>
  </g>
</svg>
